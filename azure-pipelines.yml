resources:
- repo: self
 
variables:
  dockerRegistryServiceConnection: '9aefe228-12f2-48ee-825c-6f4a5c808b81'
  imageRepository: 'observatorio-web'
  containerRegistry: 'devinspertech.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildNumber)'
  vmImageName: 'ubuntu-latest'
 
stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build Docker image and push
    pool:
      vmImage: $(vmImageName)
    steps:
      
    # ---------------------------
    # STEP 1 — BUILD COM BUILD-ARGS
    # ---------------------------
    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
        arguments: >-
          --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="$(NEXT_PUBLIC_MAPBOX_TOKEN)"
          --build-arg NEXT_PUBLIC_MAPBOX_USERNAME="$(NEXT_PUBLIC_MAPBOX_USERNAME)"
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$(NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)"
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="$(NEXT_PUBLIC_CLERK_SIGN_IN_URL)"
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL="$(NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL)"
          --build-arg NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL="$(NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL)"

    # ---------------------------
    # STEP 2 — PUSH
    # ---------------------------
    - task: Docker@2
      displayName: 'Push Docker image'
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
